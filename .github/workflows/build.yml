name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAPNP_SKIP_CHECK: 1

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev
          chmod +x scripts/mkcapnp.sh scripts/build_capnp_linux.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: room-build-ubuntu
          path: build/
          retention-days: 1

  tests-ubuntu:
    name: Tests
    needs: build-ubuntu
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/capnp-install/lib
      ROOM_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y klayout zlib1g
          chmod +x scripts/run_sample_gds_roundtrip_test.sh \
            scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh \
            scripts/run_oas_hierarchy_test.sh \
            scripts/run_oas_room_roundtrip_test.sh \
            scripts/fetch_klayout_mroom_bundle.sh \
            scripts/run_sg13g2_mroom_xor_test.sh \
            scripts/render_ci_test_summary.sh
          ls third_party/capnp-install/lib/libcapnp*.so >/dev/null || \
            (echo "Cap'n Proto libs missing; restore build cache or rebuild capnp." >&2; exit 1)

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: room-build-ubuntu
          path: build

      - name: Prepare binaries
        run: |
          chmod +x build/gds_room_roundtrip build/make_sample_gds build/oas_hierarchy build/oas_room_roundtrip 2>/dev/null || true
          mkdir -p build/logs

      - name: "sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.sh build 2>&1 | tee build/logs/sample_gds_roundtrip.log

      - name: "sg13g2 stdcell GDS round-trip"
        run: ./scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh build 2>&1 | tee build/logs/sg13g2_stdcell_gds_roundtrip.log

      - name: "OAS hierarchy"
        run: ./scripts/run_oas_hierarchy_test.sh build 2>&1 | tee build/logs/oas_hierarchy.log

      - name: "OAS ROOM round-trip"
        run: ./scripts/run_oas_room_roundtrip_test.sh build 2>&1 | tee build/logs/oas_room_roundtrip.log

      - name: Summary
        if: always()
        run: ./scripts/render_ci_test_summary.sh build/logs

  # Geometric XOR through the published KLayout+mroom binary (not apt klayout).
  # Uses sg13g2_stdcell.gds only — never wafer fixtures.
  mroom-xor-ubuntu:
    name: mroom XOR (sg13g2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Cross-repo artifact download from adatsuk/KLayout-roomdb needs a PAT
      # with actions:read (org secret GH_PAT). github.token is same-repo only.
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.ROOM_NOTIFIER || github.token }}
      KLAYOUT_ROOMDB_REPO: adatsuk/KLayout-roomdb
      KLAYOUT_BUNDLE_NAME: klayout-linux-ubuntu24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime libs for bundled KLayout
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libfontconfig1
          chmod +x scripts/fetch_klayout_mroom_bundle.sh \
            scripts/run_sg13g2_mroom_xor_test.sh

      - name: "sg13g2 XOR via prebuilt KLayout+mroom"
        run: |
          mkdir -p build/logs
          ./scripts/run_sg13g2_mroom_xor_test.sh build 2>&1 | tee build/logs/sg13g2_mroom_xor.log

      - name: Upload XOR logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sg13g2-mroom-xor-logs
          path: |
            build/logs/sg13g2_mroom_xor.log
            build/klayout-mroom-bundle/BUNDLE_SOURCE.txt
            build/tests/sg13g2_mroom_xor/
          if-no-files-found: warn
          retention-days: 7

  coverage-ubuntu:
    name: Coverage (Ubuntu)
    needs: tests-ubuntu
    runs-on: ubuntu-latest
    env:
      CAPNP_SKIP_CHECK: 1
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/capnp-install/lib
      ROOM_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            klayout \
            python3 \
            python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install gcovr pytest
          chmod +x scripts/mkcapnp.sh scripts/build_capnp_linux.sh \
            scripts/run_tests_coverage.sh \
            scripts/run_sample_gds_roundtrip_test.sh \
            scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh \
            scripts/run_oas_hierarchy_test.sh \
            scripts/run_oas_room_roundtrip_test.sh

      - name: Run tests and generate coverage
        run: ./scripts/run_tests_coverage.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: room-coverage-html
          path: |
            coverage.html
            coverage.*.html
            coverage.css
            coverage.js
            coverage_by_file.txt
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            make:p

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-windows-${{ hashFiles('scripts/build_capnp_windows.bat', 'scripts/mkcapnp.cmd') }}
          restore-keys: |
            capnp-windows-

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: "Test: sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.cmd build
