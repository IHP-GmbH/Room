name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAPNP_SKIP_CHECK: 1

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev
          chmod +x scripts/mkcapnp.sh scripts/build_capnp_linux.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: core-build-ubuntu
          path: build/
          retention-days: 1

  tests-ubuntu:
    name: Tests
    needs: build-ubuntu
    runs-on: ubuntu-latest
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/third_party/capnp-install/lib
      CORE_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y klayout zlib1g
          chmod +x scripts/run_sample_gds_roundtrip_test.sh \
            scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh \
            scripts/run_oas_hierarchy_test.sh \
            scripts/run_oas_core_roundtrip_test.sh \
            scripts/render_ci_test_summary.sh
          ls third_party/capnp-install/lib/libcapnp*.so >/dev/null || \
            (echo "Cap'n Proto libs missing; restore build cache or rebuild capnp." >&2; exit 1)

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: core-build-ubuntu
          path: build

      - name: Prepare binaries
        run: |
          chmod +x build/gds_core_roundtrip build/make_sample_gds build/oas_hierarchy build/oas_core_roundtrip 2>/dev/null || true
          mkdir -p build/logs

      - name: "sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.sh build 2>&1 | tee build/logs/sample_gds_roundtrip.log

      - name: "sg13g2 stdcell GDS round-trip"
        run: ./scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh build 2>&1 | tee build/logs/sg13g2_stdcell_gds_roundtrip.log

      - name: "OAS hierarchy"
        run: ./scripts/run_oas_hierarchy_test.sh build 2>&1 | tee build/logs/oas_hierarchy.log

      - name: "OAS CORE round-trip"
        run: ./scripts/run_oas_core_roundtrip_test.sh build 2>&1 | tee build/logs/oas_core_roundtrip.log

      - name: Summary
        if: always()
        run: ./scripts/render_ci_test_summary.sh build/logs

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            make:p

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-windows-${{ hashFiles('scripts/build_capnp_windows.bat', 'scripts/mkcapnp.cmd') }}
          restore-keys: |
            capnp-windows-

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: "Test: sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.cmd build
