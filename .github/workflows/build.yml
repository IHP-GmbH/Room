name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CAPNP_SKIP_CHECK: 1

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-linux-${{ hashFiles('scripts/build_capnp_linux.sh', 'scripts/mkcapnp.sh') }}
          restore-keys: |
            capnp-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            autoconf \
            automake \
            libtool \
            pkg-config \
            klayout
          chmod +x scripts/mkcapnp.sh scripts/build_capnp_linux.sh \
            scripts/run_sample_gds_roundtrip_test.sh \
            scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: "Test: sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.sh build

      - name: "Test: sg13g2 stdcell GDS round-trip"
        run: ./scripts/run_sg13g2_stdcell_gds_roundtrip_test.sh build

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git
          pacboy: >-
            toolchain:p
            cmake:p
            make:p

      - name: Cache Cap'n Proto
        uses: actions/cache@v4
        with:
          path: |
            third_party/capnproto
            third_party/capnp-install
          key: capnp-windows-${{ hashFiles('scripts/build_capnp_windows.bat', 'scripts/mkcapnp.cmd') }}
          restore-keys: |
            capnp-windows-

      - name: Configure
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: "Test: sample GDS round-trip"
        run: ./scripts/run_sample_gds_roundtrip_test.cmd build
