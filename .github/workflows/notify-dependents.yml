name: Notify dependents

# When ROOM main moves, rebuild Door / Qucs-S / Xschem / KLayout / EMStudio against the new tip.
# Dependents listen for repository_dispatch type "room-updated".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: repository_dispatch → dependents
    runs-on: ubuntu-latest
    # Skip the cascade for docs-only / CI-meta pushes if desired later; for now always fire.
    strategy:
      fail-fast: false
      matrix:
        repo:
          - IHP-GmbH/Door
          - adatsuk/Qucs-S-roomdb
          - adatsuk/XSchem-roomdb
          - adatsuk/KLayout-roomdb
          - IHP-GmbH/EMStudio
    steps:
      - name: Dispatch room-updated to ${{ matrix.repo }}
        env:
          # Prefer ROOM_NOTIFIER (explicit); fall back to GH_PAT / legacy.
          # Avoid secrets.A || secrets.B in one expression — empty A can blank the whole value.
          GH_TOKEN: ${{ secrets.ROOM_NOTIFIER }}
          GH_TOKEN_FALLBACK: ${{ secrets.GH_PAT }}
          GH_TOKEN_LEGACY: ${{ secrets.LIBMAN_CORE_GIT_TOKEN }}
        run: |
          TOKEN="${GH_TOKEN:-${GH_TOKEN_FALLBACK:-${GH_TOKEN_LEGACY:-}}}"
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Missing secrets.ROOM_NOTIFIER/GH_PAT on IHP-GmbH/Room — cannot notify ${{ matrix.repo }}."
            exit 1
          fi
          echo "token_len=${#TOKEN}"
          GH_TOKEN="$TOKEN" gh api --method POST "repos/${{ matrix.repo }}/dispatches" \
            -f event_type='room-updated' \
            -f client_payload[room_sha]='${{ github.sha }}' \
            -f client_payload[room_ref]='${{ github.ref_name }}'
          echo "Dispatched room-updated → ${{ matrix.repo }} (room_sha=${{ github.sha }})"
