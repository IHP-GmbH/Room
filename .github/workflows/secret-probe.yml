name: Secret probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence (no values printed)
        env:
          HAS_ROOM_NOTIFIER: ${{ secrets.ROOM_NOTIFIER != '' }}
          HAS_GH_PAT: ${{ secrets.GH_PAT != '' }}
        run: |
          echo "ROOM_NOTIFIER non-empty: ${HAS_ROOM_NOTIFIER}"
          echo "GH_PAT non-empty: ${HAS_GH_PAT}"
