<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CORE">
  <defs>
    <linearGradient id="cdb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="cdb-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#41a62a"/>
      <stop offset="100%" stop-color="#58d68d"/>
    </linearGradient>
    <linearGradient id="cdb-bean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="100%" stop-color="#5D4037"/>
    </linearGradient>
    <linearGradient id="cdb-cup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#cdb-bg)"/>

  <!-- falling trails -->
  <path d="M22 8v10M32 4v12M42 10v8" stroke="#41a62a" stroke-width="1" stroke-dasharray="2 2" opacity="0.45" stroke-linecap="round"/>

  <!-- beans falling into the cup -->
  <g transform="translate(22 11) rotate(32)">
    <ellipse rx="3.2" ry="4.8" fill="url(#cdb-bean)"/>
    <path d="M0 -4 Q0.7 0 0 4 Q-0.7 0 0 -4" fill="none" stroke="#3e2723" stroke-width="0.5" opacity="0.8"/>
    <rect x="-1.2" y="-1.2" width="2.4" height="2.4" rx="0.35" fill="#37474f" stroke="url(#cdb-g)" stroke-width="0.45"/>
  </g>
  <g transform="translate(32 7) rotate(-8)">
    <ellipse rx="3.4" ry="5" fill="url(#cdb-bean)"/>
    <path d="M0 -4.2 Q0.75 0 0 4.2 Q-0.75 0 0 -4.2" fill="none" stroke="#3e2723" stroke-width="0.5" opacity="0.8"/>
    <rect x="-1.3" y="-1.3" width="2.6" height="2.6" rx="0.35" fill="#37474f" stroke="url(#cdb-g)" stroke-width="0.45"/>
  </g>
  <g transform="translate(42 13) rotate(48)">
    <ellipse rx="3" ry="4.5" fill="url(#cdb-bean)"/>
    <path d="M0 -3.8 Q0.65 0 0 3.8 Q-0.65 0 0 -3.8" fill="none" stroke="#3e2723" stroke-width="0.5" opacity="0.8"/>
    <rect x="-1.1" y="-1.1" width="2.2" height="2.2" rx="0.3" fill="#37474f" stroke="url(#cdb-g)" stroke-width="0.4"/>
  </g>
  <g transform="translate(28 19) rotate(15)">
    <ellipse rx="2.8" ry="4.2" fill="url(#cdb-bean)" opacity="0.95"/>
    <path d="M0 -3.5 Q0.6 0 0 3.5" fill="none" stroke="#3e2723" stroke-width="0.45" opacity="0.75"/>
  </g>

  <!-- mug handle (behind) -->
  <path d="M45 30 C55 30 57 38 53 46 C49 50 43 48 43 42" fill="none" stroke="#90a4ae" stroke-width="2.2" stroke-linecap="round"/>

  <!-- CDB mug, side view -->
  <path d="M17 50 L20 26 Q32 21 44 26 L47 50 Z" fill="url(#cdb-cup)" stroke="#ecf0f1" stroke-width="1.8" stroke-linejoin="round"/>
  <ellipse cx="32" cy="27" rx="11.5" ry="3.3" fill="#3e2723"/>
  <ellipse cx="32" cy="26" rx="10" ry="2" fill="#5d4037" opacity="0.5"/>

  <!-- CORE label on the mug -->
  <text x="32" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#263238" letter-spacing="0.5">CORE</text>

  <!-- bean splashing in -->
  <g transform="translate(35 25) rotate(-25)">
    <ellipse rx="2.6" ry="3.8" fill="url(#cdb-bean)"/>
    <rect x="-1" y="-1" width="2" height="2" rx="0.3" fill="#37474f" stroke="url(#cdb-g)" stroke-width="0.4"/>
  </g>

  <path d="M21 26 Q32 22 43 26" fill="none" stroke="#fff" stroke-width="1.1" opacity="0.3" stroke-linecap="round"/>
  <path d="M45 32 C53 32 55 39 51 44" fill="none" stroke="#ecf0f1" stroke-width="1.5" stroke-linecap="round"/>
</svg>
